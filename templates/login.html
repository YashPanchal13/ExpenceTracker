<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinTrack Pro — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--bg2:#171923;--bg3:#1e2130;--card:#1a1d2e;--border:rgba(255,255,255,0.07);
--gold:#f0c040;--gold2:#e8a020;--green:#22d3a0;--red:#f0534a;--text:#f0f0f0;--text2:#9098b0;--text3:#606880}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse at 20% 50%, rgba(240,192,64,0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(91,138,240,0.04) 0%, transparent 60%)}
.auth-wrap{width:100%;max-width:440px;padding:24px}
.auth-logo{text-align:center;margin-bottom:40px}
.auth-logo h1{font-family:'Playfair Display',serif;font-size:36px;color:var(--gold);letter-spacing:-1px}
.auth-logo p{color:var(--text3);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.auth-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:36px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.auth-title{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:6px}
.auth-sub{color:var(--text3);font-size:13px;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px;font-weight:500}
.form-control{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border .2s}
.form-control:focus{border-color:var(--gold)}
.form-control::placeholder{color:var(--text3)}
.btn{display:block;width:100%;padding:13px;border-radius:8px;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;transition:all .2s;text-align:center;text-decoration:none}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}
.btn-gold:hover{opacity:0.9;transform:translateY(-1px)}
.link-row{text-align:center;margin-top:20px;font-size:13px;color:var(--text3)}
.link-row a{color:var(--gold);text-decoration:none;font-weight:500}
.flash{padding:11px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
.flash-error{background:rgba(240,83,74,0.12);border:1px solid rgba(240,83,74,0.3);color:var(--red)}
.flash-success{background:rgba(34,211,160,0.12);border:1px solid rgba(34,211,160,0.3);color:var(--green)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider span{font-size:12px;color:var(--text3)}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-logo">
    <h1>FinTrack</h1>
    <p>Professional Edition</p>
  </div>
  <div class="auth-card">
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Sign in to your account to continue</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{cat}}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-control" type="text" name="username" placeholder="Enter your username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-gold" style="margin-top:8px">Sign In →</button>
    </form>
    <div class="divider"><span>New here?</span></div>
    <a href="/register" class="btn" style="background:var(--bg3);color:var(--text2);border:1px solid var(--border);font-size:14px">Create Account</a>
  </div>
</div>
</body>
</html>
